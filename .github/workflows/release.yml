name: Pebble Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Verify Tauri frontend entry
        shell: pwsh
        run: |
          if (-not (Test-Path ".output/public/index.html")) {
            Write-Error "Pebble build did not produce .output/public/index.html"
            Get-ChildItem -Recurse ".output/public" | Select-Object FullName
            exit 1
          }
          Write-Host "Found .output/public/index.html"

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.2.2
          releaseName: "Pebble v0.2.2"
          releaseBody: "Pebble Windows installer — static Tauri frontend fix."
          releaseDraft: false
          prerelease: true
