name: Pebble Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - name: Build standalone desktop frontend
        run: bun run build:desktop

      - name: Verify Tauri frontend entry
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "Pebble desktop build did not produce dist/index.html"
            Get-ChildItem -Recurse "dist" | Select-Object FullName
            exit 1
          }
          Write-Host "Found dist/index.html"

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Pebble v__VERSION__"
          releaseBody: "Pebble Windows installer — standalone Tauri desktop build."
          releaseDraft: false
          prerelease: true
          args: "--bundles nsis,msi"
